<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Piktogram jumlah buku yang dibaca</title>
  <desc id="desc">Andi tiga ikon, Beni lima ikon, Citra empat ikon, dan Dini dua ikon. Satu ikon mewakili empat buku.</desc>
  <defs>
