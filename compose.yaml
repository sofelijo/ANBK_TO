name: anbk-cerdas

x-app: &app
  image: anbk-cerdas-app:latest
  build:
    context: .
  env_file:
    - .env.docker
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.docker
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *app
    command: ["sh", "-c", "php artisan migrate --force && apache2-foreground"]
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=2", "--timeout=120", "--max-time=3600"]
    stop_grace_period: 2m
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.docker
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
